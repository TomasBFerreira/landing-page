name: Check service coverage

# Fails if traefik-gitops routes a prod hostname the landing page doesn't list,
# or if the topology inventory references an icon file that doesn't exist.
on:
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch traefik-gitops services.yml
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          gh api repos/TomasBFerreira/traefik-gitops/contents/config/dynamic/services.yml \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/services.yml"

      - name: Compare
        run: node scripts/check-service-coverage.mjs "$RUNNER_TEMP/services.yml"

      - name: Check topology icons exist
        run: node scripts/check-icons.mjs
