# Mapped in the http{} context (this file is included as conf.d/default.conf).
# Authentik forwardAuth (the authentik-* Traefik middleware) injects the user's
# groups as a pipe-delimited X-authentik-groups header. The /admin-gate location
# below uses this to answer the landing page's admin probe: 204 for admins, 403
# otherwise. Requests only reach here when already authenticated — Traefik's
# forwardAuth bounces anonymous requests to Authentik before nginx is hit.
map $http_x_authentik_groups $lp_is_admin {
    default                    0;
    "~(^|\|)ops-admins($|\|)"  1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Admin probe (gated by the authentik-* middleware in traefik-gitops).
    location = /admin-gate {
        if ($lp_is_admin) { return 204; }
        return 403;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
