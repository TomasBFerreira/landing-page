<div class="topo">
  @for (layer of layers; track layer.label; let last = $last) {
    <div class="topo__layer">
      <span class="topo__layer-label">{{ layer.label }}</span>
      <div class="topo__nodes">
        @for (node of layer.nodes; track node.name) {
          <div class="topo__node" [attr.aria-label]="node.name + (node.note ? ' — ' + node.note : '')">
            <span class="topo__node-icon" aria-hidden="true">{{ node.icon }}</span>
            <span class="topo__node-body">
              <span class="topo__node-name">{{ node.name }}</span>
              @if (node.note) { <span class="topo__node-note">{{ node.note }}</span> }
            </span>
            @if (statusFor(node); as st) {
              <span class="status-dot"
                    aria-hidden="true"
                    [class.status-dot--up]="st === 'up'"
                    [class.status-dot--down]="st === 'down'"
                    [class.status-dot--pending]="st === 'pending'"
                    [class.status-dot--unknown]="st === 'unknown'"></span>
            }
          </div>
        }
      </div>
    </div>
    @if (!last) { <div class="topo__connector" aria-hidden="true"></div> }
  }
</div>
