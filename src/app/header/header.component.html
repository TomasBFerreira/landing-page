<header class="header">
  <div class="header__inner">

    <a class="header__brand" routerLink="/" aria-label="databaes.net home">
      <div class="header__logo">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="8" fill="currentColor" fill-opacity="0.12"/>
          <rect x="1" y="1" width="30" height="30" rx="7" stroke="currentColor" stroke-opacity="0.35" stroke-width="1"/>
          <rect x="6"  y="8"  width="20" height="3" rx="1.5" fill="currentColor"/>
          <rect x="6"  y="14" width="14" height="3" rx="1.5" fill="currentColor" fill-opacity="0.7"/>
          <rect x="6"  y="20" width="17" height="3" rx="1.5" fill="currentColor" fill-opacity="0.4"/>
        </svg>
      </div>
      <span class="header__site">databaes.net</span>
    </a>

    <nav class="header__nav" aria-label="Primary">
      <a class="header__nav-link"
         routerLink="/"
         routerLinkActive="header__nav-link--active"
         [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <!-- /investing is a separate app on the apex host; a routerLink would be
           captured by the SPA router, so use a real navigation. -->
      <a class="header__nav-link" href="/investing">Investing</a>
      <a class="header__nav-link"
         routerLink="/showcase"
         routerLinkActive="header__nav-link--active">Showcase</a>
      <a class="header__nav-link"
         routerLink="/about"
         routerLinkActive="header__nav-link--active">About</a>
      @if (auth.signedIn) {
        <a class="header__nav-link"
           routerLink="/account"
           routerLinkActive="header__nav-link--active">Account</a>
        <a class="header__nav-link"
           routerLink="/admin"
           routerLinkActive="header__nav-link--active">Admin</a>
      }
    </nav>

    <div class="header__actions">
      <a class="header__status-pill"
         routerLink="/"
         role="status"
         aria-live="polite"
         aria-atomic="true"
         [class.header__status-pill--ok]="allUp()"
         [class.header__status-pill--down]="downCount() > 0">
        <span class="status-dot"
              aria-hidden="true"
              [class.status-dot--up]="allUp()"
              [class.status-dot--pending]="!allUp() && downCount() === 0"
              [class.status-dot--down]="downCount() > 0"></span>
        <span class="header__status-text">
          @if (allUp()) { All systems operational }
          @else if (downCount() > 0) { {{ downCount() }} down }
          @else { Checking… }
        </span>
      </a>

      @if (auth.signedIn) {
        <button type="button" class="header__btn header__btn--ghost" (click)="logout()">Sign out</button>
      } @else {
        <button type="button" class="header__btn header__btn--primary" (click)="login()">Log in</button>
      }

      <button type="button"
              class="header__theme-toggle"
              (click)="toggleTheme()"
              [attr.aria-label]="'Switch to ' + (theme.theme() === 'dark' ? 'light' : 'dark') + ' mode'"
              [title]="theme.theme() === 'dark' ? 'Switch to light' : 'Switch to dark'">
        @if (theme.theme() === 'dark') {
          <!-- Sun icon (click → light) -->
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
            <circle cx="10" cy="10" r="3.5" fill="currentColor"/>
            <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <path d="M10 2v2.5"/><path d="M10 15.5V18"/>
              <path d="M2 10h2.5"/><path d="M15.5 10H18"/>
              <path d="M4.2 4.2l1.8 1.8"/><path d="M14 14l1.8 1.8"/>
              <path d="M15.8 4.2L14 6"/><path d="M6 14l-1.8 1.8"/>
            </g>
          </svg>
        } @else {
          <!-- Moon icon (click → dark) -->
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
            <path fill="currentColor" d="M17 12.3A7.5 7.5 0 0 1 7.7 3 7.5 7.5 0 1 0 17 12.3z"/>
          </svg>
        }
      </button>
    </div>

  </div>
</header>
